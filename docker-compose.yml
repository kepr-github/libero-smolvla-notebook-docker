name: libero-smolvla

services:
  notebook:
    build:
      context: .
    image: libero-smolvla-notebook:local
    working_dir: /workspace
    shm_size: "16gb"
    gpus: all
    ports:
      - "8888:8888"
    environment:
      PYTHONPATH: /workspace/docker_support/google_colab_shim:/opt/google_colab_shim
      HF_HOME: /content/workdir/hf_cache
      HF_LEROBOT_HOME: /content/workdir/lerobot_cache
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_DATASETS_DISABLE_PROGRESS_BARS: "1"
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,video
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - .:/workspace
      - libero_smolvla_workdir:/content/workdir
      - libero_smolvla_drive:/content/drive/MyDrive/smolvla_task
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=notebook
      - --ServerApp.password=

volumes:
  libero_smolvla_workdir:
  libero_smolvla_drive:
